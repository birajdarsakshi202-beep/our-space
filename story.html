<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Just For You ♡</title>


    <!-- ==============================
         GOOGLE FONTS
    =============================== -->

    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500&display=swap"
          rel="stylesheet">


    <style>

        /* =================================
           RESET
        ================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =================================
           BODY
        ================================= */

        body {

            min-height: 100vh;

            font-family: 'Poppins', sans-serif;

            background-image: url("Main1.jpg");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            background-attachment: fixed;

            color: #67251c;

            overflow-x: hidden;

        }


        /* =================================
           MAIN PAGE
        ================================= */

        .page {

            width: 100%;

            min-height: 100vh;

            padding: 70px 20px 100px;

            display: flex;

            flex-direction: column;

            align-items: center;

            position: relative;

            z-index: 5;

        }


        /* =================================
           HEADER
        ================================= */

        .eyebrow {

            font-size: 11px;

            letter-spacing: 4px;

            color: #70251f;

            margin-bottom: 15px;

            text-transform: uppercase;

        }


        h1 {

            font-family: 'Playfair Display', serif;

            font-size: clamp(
                45px,
                7vw,
                75px
            );

            color: #67201d;

            text-align: center;

            margin-bottom: 12px;

        }


        .subtitle {

            font-family: 'Caveat', cursive;

            font-size: 30px;

            color: #75372f;

            text-align: center;

        }


        /* =================================
           DIVIDER
        ================================= */

        .divider {

            display: flex;

            align-items: center;

            gap: 14px;

            margin: 25px 0 35px;

        }


        .divider span {

            width: 65px;

            height: 1px;

            background: #9b4b43;

        }


        .divider .heart {

            width: auto;

            height: auto;

            background: none;

            color: #7b2825;

        }


        /* =================================
           LOVE CARD
        ================================= */

        .love-card {

            width: min(
                750px,
                94%
            );

            min-height: 190px;

            background: rgba(
                255,
                252,
                250,
                0.96
            );

            border-radius: 25px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 35px;

            box-shadow:
                0 15px 40px
                rgba(
                    70,
                    20,
                    20,
                    0.18
                );

        }


        /* =================================
           LOVE BUTTON
        ================================= */

        .love-button {

            border: none;

            outline: none;

            background: #8c351d;

            color: white;

            padding: 16px 38px;

            border-radius: 50px;

            font-family: 'Poppins', sans-serif;

            font-size: 16px;

            font-weight: 500;

            cursor: pointer;

            box-shadow:
                0 8px 20px
                rgba(
                    100,
                    35,
                    20,
                    0.25
                );

            transition:
                transform 0.3s ease,
                background 0.3s ease;

        }


        .love-button:hover {

            background: #a7432a;

            transform:
                translateY(-4px);

        }


        .love-button:active {

            transform:
                scale(0.96);

        }


        .hint {

            margin-top: 15px;

            font-size: 13px;

            color: #92736c;

        }


        /* =================================
           BALLOON AREA
        ================================= */

        #balloonArea {

            position: fixed;

            inset: 0;

            pointer-events: none;

            overflow: hidden;

            z-index: 100;

        }


        /* =================================
           BALLOONS
        ================================= */

        .balloon {

            position: absolute;

            bottom: -130px;

            width: 52px;

            height: 65px;

            border-radius:
                50% 50%
                48% 48%;

            animation:
                flyUp
                var(--duration)
                ease-out
                forwards;

        }


        /* Balloon knot */

        .balloon::before {

            content: "";

            position: absolute;

            bottom: -6px;

            left: 50%;

            transform:
                translateX(-50%);

            width: 0;

            height: 0;

            border-left:
                6px solid transparent;

            border-right:
                6px solid transparent;

            border-top:
                8px solid
                var(--balloon-color);

        }


        /* Balloon string */

        .balloon::after {

            content: "";

            position: absolute;

            width: 1px;

            height: 85px;

            background: rgba(
                80,
                80,
                80,
                0.55
            );

            left: 50%;

            top: 63px;

        }


        /* =================================
           BALLOON ANIMATION
        ================================= */

        @keyframes flyUp {

            0% {

                transform:
                    translateY(0)
                    rotate(0deg);

                opacity: 1;

            }

            25% {

                transform:
                    translateY(-30vh)
                    rotate(-7deg);

            }

            50% {

                transform:
                    translateY(-60vh)
                    rotate(8deg);

            }

            75% {

                transform:
                    translateY(-90vh)
                    rotate(-5deg);

            }

            100% {

                transform:
                    translateY(-125vh)
                    rotate(5deg);

                opacity: 0;

            }

        }


        /* =================================
           FLOATING HEARTS
        ================================= */

        .floating-heart {

            position: absolute;

            bottom: -50px;

            color: #a83b45;

            font-size: 25px;

            animation:
                heartUp
                var(--duration)
                ease-out
                forwards;

        }


        @keyframes heartUp {

            from {

                transform:
                    translateY(0)
                    scale(0.7);

                opacity: 1;

            }

            to {

                transform:
                    translateY(-110vh)
                    scale(1.4);

                opacity: 0;

            }

        }


        /* =================================
           BIG LOVE MESSAGE
        ================================= */

        .love-message {

            position: fixed;

            left: 50%;

            top: 50%;

            transform:
                translate(-50%, -50%)
                scale(0.7);

            opacity: 0;

            z-index: 200;

            font-family: 'Caveat', cursive;

            font-size:
                clamp(
                    45px,
                    8vw,
                    85px
                );

            color: #7b211f;

            text-shadow:
                0 3px 15px
                rgba(
                    255,
                    220,
                    220,
                    0.9
                );

            pointer-events: none;

            transition:
                opacity 0.5s ease,
                transform 0.5s ease;

        }


        .love-message.show {

            opacity: 1;

            transform:
                translate(-50%, -50%)
                scale(1);

        }


        /* =================================
           PHOTO SECTION
        ================================= */

        .photo-section {

            width: min(
                1100px,
                94%
            );

            margin-top: 55px;

            padding: 70px 20px;

            background: rgba(
                255,
                252,
                250,
                0.95
            );

            border-radius: 25px;

            display: flex;

            justify-content: center;

            box-shadow:
                0 15px 40px
                rgba(
                    70,
                    20,
                    20,
                    0.14
                );

        }


        /* =================================
           POLAROID
        ================================= */

        .photo-frame {

            width: min(
                460px,
                90%
            );

            background: #fffdfb;

            padding:
                18px
                18px
                28px;

            position: relative;

            box-shadow:
                0 12px 35px
                rgba(
                    50,
                    20,
                    15,
                    0.20
                );

            transform:
                rotate(-1.2deg);

            transition:
                transform 0.4s ease;

        }


        .photo-frame:hover {

            transform:
                rotate(0deg)
                translateY(-5px);

        }


        /* =================================
           TAPE
        ================================= */

        .tape {

            position: absolute;

            width: 105px;

            height: 32px;

            top: -17px;

            background:
                repeating-linear-gradient(
                    -45deg,

                    rgba(
                        197,
                        160,
                        143,
                        0.65
                    ),

                    rgba(
                        197,
                        160,
                        143,
                        0.65
                    ) 7px,

                    rgba(
                        225,
                        195,
                        183,
                        0.65
                    ) 7px,

                    rgba(
                        225,
                        195,
                        183,
                        0.65
                    ) 14px
                );

            z-index: 5;

        }


        .tape-left {

            left: 30px;

            transform:
                rotate(-6deg);

        }


        .tape-right {

            right: 30px;

            transform:
                rotate(6deg);

        }


        /* =================================
           PHOTO WRAPPER
        ================================= */

        .photo-wrapper {

            position: relative;

        }


        /* =================================
           YOUR PHOTO
        ================================= */

        .photo-frame img {

            width: 100%;

            height: 520px;

            object-fit: cover;

            display: block;

            border-radius: 4px;

        }


        /* =================================
           PHOTO COUNTER
        ================================= */

        .photo-count {

            position: absolute;

            right: 12px;

            top: 12px;

            background: white;

            padding:
                7px 12px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: 500;

            color: #6d291f;

            box-shadow:
                0 3px 10px
                rgba(
                    0,
                    0,
                    0,
                    0.12
                );

        }


        /* =================================
           PHOTO CAPTION
        ================================= */

        .photo-caption {

            font-family: 'Caveat', cursive;

            font-size: 25px;

            color: #75392e;

            text-align: center;

            margin-top: 15px;

        }


        /* =================================
           BOTTOM MESSAGE
        ================================= */

        .bottom-message {

            margin-top: 35px;

            text-align: center;

            font-family: 'Caveat', cursive;

            font-size: 28px;

            color: #71342c;

        }


        /* =================================
           MOBILE
        ================================= */

        @media (max-width: 600px) {

            .page {

                padding-top: 50px;

            }


            h1 {

                font-size: 48px;

            }


            .subtitle {

                font-size: 27px;

            }


            .love-card {

                min-height: 175px;

                padding: 25px;

            }


            .love-button {

                padding:
                    14px 28px;

                font-size: 14px;

            }


            .photo-section {

                padding:
                    50px 15px;

            }


            .photo-frame {

                width: 95%;

            }


            .photo-frame img {

                height: 420px;

            }


            .tape {

                width: 80px;

            }


            .tape-left {

                left: 15px;

            }


            .tape-right {

                right: 15px;

            }

        }
        .next-area {
    text-align: center;
    margin-top: 30px;
    margin-bottom: 50px;
}

.next-button {
    display: inline-block;
    text-decoration: none;
    background: #8c351d;
    color: white;
    padding: 15px 32px;
    border-radius: 30px;
    font-family: 'Poppins', sans-serif;
    font-size: 15px;
    transition: 0.3s;
    box-shadow: 0 8px 20px rgba(100, 40, 25, 0.2);
}

.next-button:hover {
    background: #a7432a;
    transform: translateY(-3px);
}

    </style>

</head>


<body>


    <!-- =================================
         BALLOON CONTAINER
    ================================== -->

    <div id="balloonArea"></div>


    <!-- =================================
         BIG I LOVE YOU
    ================================== -->

    <div id="loveMessage"
         class="love-message">

        I LOVE YOU ♡

    </div>


    <!-- =================================
         MAIN PAGE
    ================================== -->

    <main class="page">


        <!-- HEADER -->

        <p class="eyebrow">
            A LITTLE SOMETHING FOR YOU
        </p>


        <h1>
            Just For You ♡
        </h1>


        <p class="subtitle">
            Because I can never say it enough...
        </p>


        <div class="divider">

            <span></span>

            <span class="heart">♥</span>

            <span></span>

        </div>


        <!-- =================================
             I LOVE YOU BUTTON
        ================================== -->

        <section class="love-card">


            <button
                class="love-button"
                id="loveButton">

                💌 I Love You! 💌

            </button>


            <p class="hint">

                Press it... ♡

            </p>


        </section>



        <!-- =================================
             PHOTO CARD
        ================================== -->

        <section class="photo-section">


            <div class="photo-frame">


                <!-- LEFT TAPE -->

                <div class="tape tape-left"></div>


                <!-- RIGHT TAPE -->

                <div class="tape tape-right"></div>


                <!-- PHOTO -->

                <div class="photo-wrapper">


                    <img
                        src="/US1.png*"
                        alt="Our favourite memory">


                    <!-- PHOTO COUNTER -->

                    <div class="photo-count">

                        ♥ 1 / 1

                    </div>


                </div>


                <!-- CAPTION -->

                <p class="photo-caption">

                    we will recreate this soon ♡

                </p>


            </div>


        </section>


        <!-- BOTTOM MESSAGE -->

        <p class="bottom-message">

            Distance means nothing when it's us. ♡

        </p>
        <div class="next-area">

    <a href="reasons.html" class="next-button">
        Things I Love About You ♡ →
    </a>

</div>


    </main>



    <!-- =================================
         JAVASCRIPT
    ================================== -->

    <script>

        const button =
            document.getElementById(
                "loveButton"
            );


        const balloonArea =
            document.getElementById(
                "balloonArea"
            );


        const loveMessage =
            document.getElementById(
                "loveMessage"
            );


        button.addEventListener(
            "click",
            function () {


                /* Remove old animation */

                balloonArea.innerHTML = "";


                /* Show big message */

                loveMessage.classList.add(
                    "show"
                );


                /* Change button text */

                button.innerHTML =
                    "♡ I Love You More ♡";


                /* Balloon colours */

                const colors = [

                    "#7b211f",

                    "#9c3d35",

                    "#c06b62",

                    "#d89b91",

                    "#ead5cf",

                    "#8f493d"

                ];


                /* Create balloons */

                for (
                    let i = 0;
                    i < 35;
                    i++
                ) {

                    const balloon =
                        document.createElement(
                            "div"
                        );


                    balloon.className =
                        "balloon";


                    const color =
                        colors[
                            Math.floor(
                                Math.random()
                                *
                                colors.length
                            )
                        ];


                    balloon.style.background =
                        color;


                    balloon.style.setProperty(
                        "--balloon-color",
                        color
                    );


                    balloon.style.left =
                        (
                            Math.random()
                            * 100
                        ) + "%";


                    balloon.style.setProperty(
                        "--duration",
                        (
                            3.5
                            +
                            Math.random()
                            * 2
                        ) + "s"
                    );


                    balloon.style.animationDelay =
                        (
                            Math.random()
                            * 1.2
                        ) + "s";


                    balloonArea.appendChild(
                        balloon
                    );

                }


                /* Create hearts */

                for (
                    let i = 0;
                    i < 25;
                    i++
                ) {

                    const heart =
                        document.createElement(
                            "div"
                        );


                    heart.className =
                        "floating-heart";


                    heart.innerHTML =
                        Math.random() > 0.5
                        ? "♡"
                        : "♥";


                    heart.style.left =
                        (
                            Math.random()
                            * 100
                        ) + "%";


                    heart.style.setProperty(
                        "--duration",
                        (
                            3
                            +
                            Math.random()
                            * 3
                        ) + "s"
                    );


                    heart.style.animationDelay =
                        (
                            Math.random()
                            * 1.5
                        ) + "s";


                    balloonArea.appendChild(
                        heart
                    );

                }


                /* Hide big message */

                setTimeout(
                    function () {

                        loveMessage
                            .classList
                            .remove(
                                "show"
                            );

                    },
                    3000
                );


            }
        );

    </script>


</body>

</html>
